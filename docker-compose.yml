services:
  # ----------------------- DATABASE -----------------------
  db:
    image: postgres:15
    container_name: ev_db
    restart: always
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: contraseña
      POSTGRES_DB: evcharging
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ev_net
  # ----------------------- DB CONTROLLER -----------------------
  central:
    build: ./central
    container_name: central
    depends_on:
      - db
#      - kafka
    ports:
      - "4000:4000"
    networks:
      - ev_net
    command: npm run start
  # ----------------------- KAFKA -----------------------
  

  # ----------------------- CHARGING POINTS -----------------------

  # ----------------------- VOLUMES & NETWORKS -----------------------
volumes:
  postgres_data:

networks:
  ev_net:
    driver: bridge