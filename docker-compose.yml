services:
  # ----------------------- DATABASE -----------------------
  db:
    image: postgres:15
    container_name: ev_db
    restart: always
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: contraseña
      POSTGRES_DB: evcharging
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ev_net
  # ----------------------- CENTRAL -----------------------
  central:
    build: ./central
    container_name: central
    environment:
      DB_HOST: "db"
      DB_PORT: 5432
      DB_NAME: "evcharging"
      DB_USER: "usuario"
      DB_PASSWORD: "contraseña"
      KAFKA_BOOTSTRAP: "kafka:9092"
      # kafka
      KAFKA_TOPIC_CP_CENTRAL_CREATE: "t_cp_central_create"
      KAFKA_TOPIC_CENTRAL_CP_CMD: "t_central_cp_cmd"
      # sockets
      CP_CENTRAL_STATUS_SOCKET: "CP_Central_Status_Socket"
      CP_CENTRAL_CREATE_SOCKET: "CP_Central_Create_Socket"
    depends_on:
      kafka:
        condition: service_healthy
      db: 
        condition: service_started
    ports:
      - "4000:4000"
    networks:
      - ev_net
    command: npm run start

  # ----------------------- KAFKA -----------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: ev_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ev_net

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: ev_kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 5s
      retries: 10

    ports:
      - "9092:9092"
    networks:
      - ev_net
  # ----------------------- CHARGING POINTS -----------------------

  # ----------------------- VOLUMES & NETWORKS -----------------------
volumes:
  postgres_data:
  
  kafka_data:

networks:
  ev_net:
    driver: bridge