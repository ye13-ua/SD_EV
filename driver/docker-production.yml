version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: ev_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ev_net

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: ev_kafka
    depends_on:
      - zookeeper
    command: bash -c "sleep 10 && /etc/confluent/docker/run"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://ev_kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    networks:
      - ev_net
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server=kafka:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ====================================
  # CENTRAL (dummy para pruebas)
  central:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: ev_central
    command: python dummy_central.py
    environment:
      - KAFKA_BOOTSTRAP=ev_kafka:9092
      - FLASK_PORT=4000
    ports:
      - "8000:4000"
    networks:
      - ev_net
    depends_on:
      - kafka
    restart: on-failure

  # ====================================
  # DRIVER (instancias escalables)
  driver:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - KAFKA_BOOTSTRAP=ev_kafka:9092
      - FLASK_PORT=5000
    ports:
      - "9200-9299:5000"  # rango de mapeo dinámico al host
    networks:
      - ev_net
    depends_on:
      - kafka
    restart: on-failure

networks:
  ev_net:
    driver: bridge
