services:
  # ----------------------- DATABASE -----------------------
  db:
    image: postgres:15
    container_name: ev_db
    restart: always
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: contraseña
      POSTGRES_DB: evcharging
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ev_net

  # ----------------------- KAFKA -----------------------
  
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: ev_zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    networks:
      - ev_net

  kafka:
    image: bitnami/kafka:latest
    container_name: ev_kafka
    depends_on:
      - zookeeper
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    ports:
      - "9092:9092"
    networks:
      - ev_net

  # ----------------------- CENTRAL -----------------------
  central:
    build: ./central
    container_name: ev_central
    restart: always
    depends_on:
      - db
      - kafka
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: evcharging
      DB_USER: usuario
      DB_PASSWORD: contraseña
      KAFKA_BOOTSTRAP: kafka:9092
      CENTRAL_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./central:/app
    networks:
      - ev_net
    command: python central.py

  # ----------------------- CHARGING POINTS -----------------------
  cp1:
    build: ./charging_point
    container_name: ev_cp1
    restart: always
    depends_on:
      - central
    environment:
      CP_ID: CP1
      CENTRAL_HOST: central
      CENTRAL_PORT: 8000
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./charging_point:/app
    networks:
      - ev_net
    command: python engine.py

  cp2:
    build: ./charging_point
    container_name: ev_cp2
    restart: always
    depends_on:
      - central
    environment:
      CP_ID: CP2
      CENTRAL_HOST: central
      CENTRAL_PORT: 8000
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./charging_point:/app
    networks:
      - ev_net
    command: python engine.py

  # ----------------------- DRIVERS -----------------------
  driver1:
    build: ./driver
    container_name: ev_driver1
    restart: always
    depends_on:
      - kafka
      - central
    environment:
      DRIVER_ID: Driver1
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./driver:/app
    networks:
      - ev_net
    command: python driver.py

  driver2:
    build: ./driver
    container_name: ev_driver2
    restart: always
    depends_on:
      - kafka
      - central
    environment:
      DRIVER_ID: Driver2
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./driver:/app
    networks:
      - ev_net
    command: python driver.py

# ----------------------- VOLUMES & NETWORKS -----------------------
volumes:
  postgres_data:

networks:
  ev_net:
    driver: bridge